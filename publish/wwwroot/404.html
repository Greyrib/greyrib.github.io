<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script>
        // GitHub Pages 404 fallback: redirect to index.html and preserve the full path
        var pathname = window.location.pathname;
        var search = window.location.search || '';
        var hash = window.location.hash || '';
        var newUrl = '/index.html' + '?path=' + encodeURIComponent(pathname + search + hash);
        window.location.replace(newUrl);
    </script>
</head>
<body>
    <p>Redirecting...</p>
</body>
</html>
