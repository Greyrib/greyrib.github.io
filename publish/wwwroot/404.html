<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <meta http-equiv="refresh" content="0; url=./index.html">
    <script>
        // Redirect to index.html and preserve full path and query
        var currentPath = location.pathname + location.search + location.hash;
        var newUrl = "/index.html?redirect=" + encodeURIComponent(currentPath);
        window.location.replace(newUrl);
    </script>
</head>
<body>
    <p>Redirecting...</p>
</body>
</html>
